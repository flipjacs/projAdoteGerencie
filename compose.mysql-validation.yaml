services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: gestor_adocao_test
      MYSQL_USER: apisys_test
      MYSQL_PASSWORD: ${MYSQL_TEST_PASSWORD:?Defina MYSQL_TEST_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_TEST_ROOT_PASSWORD:?Defina MYSQL_TEST_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MYSQL_TEST_PORT:-3309}:3306"
    volumes:
      - mysql_validation_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u \"$$MYSQL_USER\" -D \"$$MYSQL_DATABASE\" -Nse 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

volumes:
  mysql_validation_data:
